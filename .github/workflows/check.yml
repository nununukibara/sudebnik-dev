# 公開前検査を GitHub 上で走らせる。
#
# tools/check-template.mjs と同じものを実行する。手元に Node.js が無くても使える。
#
# ── 既定は「手動起動」 ──────────────────────────────
# 初期状態では、GitHubの Actions タブから自分で押したときだけ動く。
# 勝手に動いて利用枠を消費しないようにしてある。
#
# 自動で走らせたい場合は、下の on: の中のコメントを外すこと。
#
# ── 費用について ────────────────────────────────
# GitHub Actions には実行時間の枠がある。
#   - 公開リポジトリ: 標準のランナーなら無料
#   - 非公開リポジトリ: 毎月の無料枠があり、超えた分は課金される
# 枠の大きさは契約プランで違う。現在の残量と上限は GitHub の
# Settings → Billing で確認すること。
#
# この検査自体は1回あたり1分未満で終わる。ただし自分のテストを足すと伸びる。
# ─────────────────────────────────────────────

name: check

on:
  # 手動起動。Actionsタブで「Run workflow」を押すと動く。
  workflow_dispatch:

  # 自動で走らせる場合は、必要な方のコメントを外す。
  #
  # Pull Request のときだけ走らせる（推奨。実行回数を抑えられる）:
  # pull_request:
  #
  # push のたびに走らせる（一番早く気づけるが、実行回数は増える）:
  # push:

# 既定では読み取りだけ許可する。書き込みが必要になるまで広げない。
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # 止まらなくなったときの保険。GitHubの既定は6時間で、
    # その間ずっと利用枠を消費する。検査は1分未満で終わるので、
    # 自分のテストを足したら、それに見合う値へ増やすこと。
    timeout-minutes: 15

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Nodeを用意
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # 秘密値らしい文字列、個人PCの絶対パス、リンク切れ、
      # Gitへ入れてはいけないファイル名、必須文書の有無、LICENSEの有無を見る。
      # 警告（LICENSE未選択など）では落ちない。エラーのときだけ落ちる。
      - name: 公開前検査
        run: node tools/check-template.mjs

      # ── あなたのテスト ─────────────────────────────
      # プロジェクトのテストを用意したら、下のコメントを外して書き換える。
      # 言語やツールは問わない。テストが失敗したときに 0 以外で終わればよい。
      #
      # - name: 依存を入れる
      #   run: npm ci
      #
      # - name: テスト
      #   run: npm test
      # ─────────────────────────────────────────────
